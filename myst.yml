version: 1

# ── Project metadata ────────────────────────────────────────────────────────
project:
  title: Geophysics as a tool for post-fire soil restauration 🔥 
  #subtitle: resipy & emagpy Course
  short_title: Geophysics & post-fire soil restauration 🔥 
  bibliography: references.bib
  description: Material didáctico correspondiente a la Microcredencial en Inteligencia Artificial y Tecnologías Geoespaciales aplicadas a la Restauración de Ecosistemas Forestales afectados por incendios y sequías extremas.
  # ── Authors ────────────────────────────────────────────────────────────────
  keywords:
    - geophysics
    - electrical resistivity tomography
    - electromagnetic induction
    - python
    - resipy
    - emagpy
    - open education
  authors:
      - name: Benjamin Mary
        affiliation:
          - Instituto de Ciencias Agrarias
          - CSIC
        orcid: 0000-0003-0815-842X
        email: benjamin.mary@ica.csic.es
        corresponding: true
      - name: Héctor Nieto
        affiliation: 
          - Instituto de Ciencias Agrarias
          - CSIC
        orcid: 0000-0003-4250-6424
        email: hector.nieto@ica.csic.es
      - name: María Burguet Marimón
        affiliation: 
          - Instituto de Ciencias Agrarias
          - CSIC
        orcid: 0000-0002-9748-8078

        
        
  # ── Publication info ───────────────────────────────────────────────────────
  copyright: "2025"
  license:
    content: CC-BY-4.0
    code: MIT
  doi: 10.5281/zenodo.0000000   # update once published
  version: "1.0.0"
  date: 2025-01-19



  # ── Repository & links ─────────────────────────────────────────────────────
  github: https://github.com/BenjMy/geophysics_postfire_book-jb2
  jupyter:
    execute: true
    binder:
      repo: https://github.com/BenjMy/geophysics_postfire_book-jb2
  settings:
    output_matplotlib_strings: remove
    output_stderr: remove-warn
    #output_stderr: show
    
  # ── Exports ───────────────────────────────────────────────────────────────
  exports:
    - format: typst
      template: plain_typst_book  # clean academic PDF template
      output: microcredencial-geophysics.pdf    
      cover: ./assets/images/logo_main.png
      logo: ./assets/images/logo_main.png
      logo_width: 40
      Logoposition: right
      options:
       toc: true
       toc_depth: 2        # ← controls depth shown in PDF table of contents       


  # ── Numbering ──────────────────────────────────────────────────────────────
  numbering:
    heading_1: true
    heading_2: true
    heading_3: true   # stops at 1.1 — never goes to 1.1.1
    heading_4: false
    heading_5: false
    heading_6: false
 
    
  # ── Notebook execution ─────────────────────────────────────────────────────
  execute:
    execute_notebooks: auto      # auto | force | never
    timeout: 600                 # seconds per cell before aborting
    allow_errors: false          # fail build on cell error
    stderr_output: show          # show | remove | warn
    requirements: requirements.txt

  # Kernel to use for .md code-cell pages (MyST notebooks without .ipynb)
  kernels:
    - id: python3
      display_name: Python 3 (Geophysics)
      language: python

  # ── Table of Contents ──────────────────────────────────────────────────────
  toc:
    - title: "Introduction"
    - file: intro_microcredential_UCLM.md

    - title: "Agenda"
      children:
        - file: docs/agenda.md

    - title: "How-to"
      children:
        - file: docs/getting_started.md
        - file: docs/01_python_basics.md            
        #- file: docs/installation.md
        #- file: docs/troubleshooting.md

    # ── Theory ───────────────────────────────────────────────────────────────
    - title: Bloc 1 · Fundamentals
      children:
        - file: notebooks/01_introduction/013_postfire_soil_basics.md
        - file: notebooks/01_introduction/02_geophysical_methods.md                       
        - file: notebooks/01_introduction/013_postfire_soil_basics_geophysics.md                       



    - title: "Bloc 2 · Resistivity"
      children:
        - file: notebooks/02_resistivity/012_ER_concept.md           
        - file: notebooks/02_resistivity/01_resistivity_introduction.md  
        - file: notebooks/02_resistivity/01_resipy_introduction.md

    - title: "Bloc 3 · Electromagnetics"
      children:
        - file: notebooks/03_electromagnetics/01_electromagnetics_introduction.md
        - file: notebooks/03_electromagnetics/01_emagpy_introduction.md


    - title: "Bloc 4 · Petro/pedophysics"
      children:
        - file: notebooks/pedophysics.md
          
    # ── Practical Cases ───────────────────────────────────────────────────────
    - title: Practical Cases
      children:
        - file: notebooks/practical_cases/introduction_GRWATER.md
        - title: "💧 Watershed case study"
          children:
            - file: notebooks/practical_cases/Agramon_EM.md
            #- file: notebooks/practical_cases/Agramon_ERT.md
            #- file: notebooks/practical_cases/Hellin_EM.md
        - title: "🪨 Sedimendation dams"
          children:
            - file: notebooks/practical_cases/Hellin_diques.md

    # ── Exercises ─────────────────────────────────────────────────────────────
    - title: "🧪 Exercises"
      children:
        - file: exercises/README.md
        - file: exercises/Exercice1_ResistivityBasics.md
        - file: exercises/Exercice2_ERTSurveyDesign.md
        - file: exercises/Exercice3_FieldDataAnalysis.md
        - file: exercises/Exercice4_FieldDataInterpretation.md    
        - file: exercises/Exercice5_PostFire_bib.md
    
    - file: glossary.md
      title: Glossary
  
  
    # ── R&D ─────────────────────────────────────────────────────────────
    #- title: "R&D"
    # children:
    #   - file: docs/RD.md

  parts:
    abstract: | 
      Este libro digital (*Jupyter Notebook*) contiene el material online necesario para cursar 
      la parte `Geofisica aplicada a la restauración de espacios naturales` de la 
      `Microcredencial en Inteligencia Artificial y Tecnologías Geoespaciales aplicadas a la 
      Restauración de Ecosistemas Forestales afectados por incendios y sequías extremas`.
    acknowledgements: |
      Este material didáctico ha sido desarrollado gracias al proyecto GRwater – 
      Programa Prismas y Problemas de la Fundación BBVA 2023
  Options:
    logo: ./assets/images/logo_main.png
    
    
# ── Site (web) settings ─────────────────────────────────────────────────────
site:
  template: book-theme
  index: intro.md
  title: Libro digital sobre geofisica aplicada a la restauración de espacios naturales
   
    
  # ── Call-to-action buttons ────────────────────────────────────────────────
  actions:
    - title: ⭐ Star
      url: https://github.com/BenjMy/geophysics_postfire_book-jb2
    - title: 🚀 Launch
      url: https://mybinder.org/v2/gh/BenjMy/geophysics_postfire_book-jb2/main


  # ── Theme options ─────────────────────────────────────────────────────────
  options:
    show_nav_depth: 2
    hide_outline: false
    outline_maxdepth: 2         # Max depth shown in sidebar TOC (1 = titles only, 2 = titles + h2)
    # Show "Open in JupyterLab / Binder / Thebe" launch buttons on notebook pages
    launch_buttons: true
    thebe: true                  # 🐝 Enable Thebe live code execution in-page
    default_mode: light          # Default to light mode
    logo_text: Microcredencial UCLM
    logo: ./assets/images/logo_main.png
    
glossary: glossary.md





  
